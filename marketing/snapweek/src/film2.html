<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>SnapWeek Motion</title>
<style>
@font-face{font-family:"Bricolage";src:url(data:font/woff2;base64,%%FONT_B%%) format("woff2");font-weight:400 800;font-stretch:75% 100%;font-display:block}
@font-face{font-family:"ArchivoN";src:url(data:font/woff2;base64,%%FONT_A%%) format("woff2");font-weight:500 700;font-display:block}
:root{--bg:#efefec;--fg:#17171a;--mute:#5d5d62;--brand:#d97757;--brand-ink:#ae4e2e;--acc:#f29a1f;--cream:#fbf6f2;--dark:#151517}
*{box-sizing:border-box;margin:0;padding:0}
html,body{background:#0b0b0c;height:100%}
body{display:grid;place-items:center;font-family:"Bricolage",system-ui,sans-serif;color:var(--fg)}
#vp{width:min(100vw,56.25vh);aspect-ratio:9/16;position:relative;overflow:hidden}
#stage{position:absolute;left:0;top:0;width:1080px;height:1920px;transform-origin:0 0;overflow:hidden;background:var(--bg)}
.L{position:absolute;inset:0}
.edge{font:600 34px/1 "ArchivoN",sans-serif;letter-spacing:.16em;text-transform:uppercase}
#bgw{position:absolute;inset:0;background:var(--bg)}
.blob{position:absolute;border-radius:50%;filter:blur(60px)}
#b1{width:1100px;height:1100px;background:radial-gradient(circle,rgba(217,119,87,.38),rgba(217,119,87,0) 65%)}
#b2{width:1200px;height:1200px;background:radial-gradient(circle,rgba(242,154,31,.30),rgba(242,154,31,0) 62%)}
#terra{position:absolute;inset:0;background:radial-gradient(1200px 1000px at 50% 30%,#e48a6c,#d97757 55%,#c4643f)}
/* floating photos */
.fp{position:absolute;left:0;top:0;border-radius:34px;background-size:cover;background-position:center;box-shadow:0 40px 80px rgba(60,30,20,.28);border:10px solid #fff}
/* headline */
.hl{position:absolute;left:70px;right:70px;font-weight:800;letter-spacing:-.045em;font-stretch:84%;line-height:.95}
.hl .w{display:inline-block;overflow:hidden;vertical-align:top;padding:0 .02em .1em}
.hl .wi{display:inline-block}
.hl .a{color:var(--brand)}
#h0{top:250px;font-size:170px}
#cap{top:110px;font-size:118px}
#oh{top:150px;font-size:126px;color:var(--cream)}
#oh .a{color:var(--fg)}
/* logo */
#logo{position:absolute;left:340px;top:560px;width:400px;height:400px}
#logo svg{width:100%;height:100%;filter:drop-shadow(0 40px 60px rgba(174,78,46,.35))}
#wm{position:absolute;left:0;right:0;top:1030px;text-align:center;font-weight:800;font-size:190px;letter-spacing:-.045em;font-stretch:86%}
#wm .c{display:inline-block}#wm .k{color:var(--brand-ink)}
#tag{position:absolute;left:0;right:0;top:1250px;text-align:center;font-size:64px;font-weight:600;color:var(--mute);letter-spacing:-.02em}
/* phone */
#ph3{position:absolute;inset:0;perspective:2600px}
#phone{position:absolute;left:250px;top:440px;width:580px;height:1220px;border-radius:84px;background:#111113;box-shadow:0 80px 160px rgba(60,30,20,.32),inset 0 0 0 4px #2b2b2f}
#scr{position:absolute;left:20px;top:20px;width:540px;height:1180px;border-radius:66px;overflow:hidden;background:var(--bg)}
#island{position:absolute;left:200px;top:18px;width:140px;height:40px;border-radius:22px;background:#111113;z-index:20}
.pg{position:absolute;left:0;top:0;width:540px;height:1180px;overflow:hidden}
.pg .cnt{position:absolute;left:0;top:62px;width:540px;will-change:transform}
.pg .hdr,.pg .tab{position:absolute;left:0;width:540px;z-index:5}
.pg .hdr{top:0}.pg .tab{bottom:0}
.pg .sbar{position:absolute;left:0;top:0;width:540px;height:62px;background:var(--bg);z-index:6;display:flex;justify-content:space-between;align-items:flex-end;padding:0 46px 6px;font:700 22px "ArchivoN"}
/* hearts */
.heart{position:absolute;width:120px;height:120px}
/* mascot */
.snap{position:absolute;width:640px;height:640px;background-size:contain;background-repeat:no-repeat;background-position:center bottom;filter:drop-shadow(0 30px 40px rgba(60,30,20,.25))}
/* outro */
#url{position:absolute;left:50%;top:640px;display:flex;align-items:center;gap:22px;background:var(--fg);color:var(--cream);border-radius:999px;padding:32px 56px;font-weight:800;font-size:66px;letter-spacing:-.02em;white-space:nowrap;overflow:hidden}
#url img{width:70px;height:70px}
#shine{position:absolute;top:0;bottom:0;width:160px;background:linear-gradient(100deg,transparent,rgba(255,255,255,.35),transparent)}
#bio{position:absolute;left:0;right:0;top:800px;text-align:center;color:var(--cream);font-weight:800;font-size:76px;letter-spacing:-.035em;font-stretch:86%}
#bio span{color:var(--fg)}
#osub{position:absolute;left:0;right:0;top:930px;text-align:center;color:var(--cream);font-size:44px}
#osub span{display:inline-block;background:rgba(23,23,26,.18);border-radius:999px;padding:16px 32px;margin:0 8px}
#demo{position:absolute;left:70px;right:70px;top:372px;text-align:left;font:600 22px "ArchivoN";letter-spacing:.14em;text-transform:uppercase;color:var(--mute);opacity:.75}
#grain{position:absolute;inset:0;width:1080px;height:1920px;mix-blend-mode:multiply;opacity:.05}
#ctl{position:fixed;left:12px;bottom:12px;display:flex;gap:8px;z-index:99;font:600 13px system-ui}
#ctl button{background:#222;color:#eee;border:1px solid #444;border-radius:8px;padding:6px 12px;cursor:pointer}
body.export #ctl{display:none}
</style></head><body>
<div id="vp"><div id="stage" role="img" aria-label="SnapWeek promo film: a new photo theme every Monday, post one frame a day, get likes and comments, discover photographers, climb the weekly ranking. With Snappy the mascot. snapweek.web.app">
  <div class="L" id="bgw"><div class="blob" id="b1"></div><div class="blob" id="b2"></div></div>
  <div class="L" id="terra"></div>
  <div class="L" id="fps"></div>
  <div class="hl" id="h0"></div>
  <div class="L" id="logoL"><div id="logo"><img src="%%IMG:icon.svg%%" style="width:100%;height:100%;filter:drop-shadow(0 40px 60px rgba(174,78,46,.35))" alt=""></div><div id="wm"></div><div id="tag">The weekly photo challenge.</div></div>
  <div class="L" id="ph3"><div id="phone"><div id="scr"><div id="island"></div><div id="pages"></div></div></div></div>
  <div class="L" id="hearts"></div>
  <div class="hl" id="cap"></div>
  <div class="L" id="snaps"></div>
  <div class="L" id="outro"><div class="hl" id="oh"></div>
    <div id="url"><img src="%%IMG:icon.svg%%" alt="">snapweek.web.app<i id="shine"></i></div>
    <div id="bio">Discover the app <span>in the bio</span></div><div id="osub"><span>Free</span><span>Web &amp; Android</span></div></div>
  <div id="demo">Real app · demo profiles, illustrative photos</div>
  
</div></div>
<div id="ctl"><button id="play">Play</button><button id="snd">Sound off</button><span id="tm" style="color:#aaa;padding:6px"></span></div>
<audio id="aud" src="data:audio/mpeg;base64,%%AUDIO%%" preload="auto"></audio>
<script>
(() => {
const SPEED = 1 / 0.9, DUR = 40; // film authored on a 40 s clock, played 10 % faster (36 s)
const $ = s => document.querySelector(s), $$ = s => [...document.querySelectorAll(s)];
const clamp = (x, a = 0, z = 1) => Math.min(z, Math.max(a, x)), lerp = (a, z, p) => a + (z - a) * p;
const P = (t, a, d) => clamp((t - a) / d);
const E = { o3: p => 1 - (1 - p) ** 3, o5: p => 1 - (1 - p) ** 5, i3: p => p ** 3, io3: p => p < .5 ? 4 * p ** 3 : 1 - (-2 * p + 2) ** 3 / 2,
  io5: p => p < .5 ? 16 * p ** 5 : 1 - (-2 * p + 2) ** 5 / 2, back: p => 1 + 2.2 * (p - 1) ** 3 + 1.2 * (p - 1) ** 2, spring: p => 1 - Math.exp(-5 * p) * Math.cos(8 * p) };
const vis = (el, on) => el.style.visibility = on ? 'inherit' : 'hidden';
const put = (el, o) => { el.style.transform = `translate3d(${(o.x || 0).toFixed(2)}px,${(o.y || 0).toFixed(2)}px,0) rotate(${(o.r || 0).toFixed(3)}deg) scale(${(o.s ?? 1).toFixed(4)})`;
  if (o.op !== undefined) el.style.opacity = clamp(o.op).toFixed(3); el.style.filter = o.blur > .2 ? `blur(${o.blur.toFixed(2)}px)` : ''; };
// keyframe track: [[t, v], ...] eased io3 between keys
const track = (K, t, ease = E.io3) => { if (t <= K[0][0]) return K[0][1]; for (let i = 0; i < K.length - 1; i++) if (t < K[i + 1][0]) { const p = ease((t - K[i][0]) / (K[i + 1][0] - K[i][0])); const a = K[i][1], z = K[i + 1][1]; return Array.isArray(a) ? a.map((v, j) => lerp(v, z[j], p)) : lerp(a, z, p); } return K[K.length - 1][1]; };
const IMG = { home: '%%IMG:screens/home.jpg%%', theme: '%%IMG:screens/theme.jpg%%', discover: '%%IMG:screens/discover.jpg%%', ranking: '%%IMG:screens/ranking.jpg%%', profile: '%%IMG:screens/profile.jpg%%',
  header: '%%IMG:screens/header.png%%', headerDisc: '%%IMG:screens/header-disc.png%%', tabHome: '%%IMG:screens/tab-home.png%%', tabDisc: '%%IMG:screens/tab-disc.png%%', tabRank: '%%IMG:screens/tab-rank.png%%' };
const SNAP = { hello: '%%IMG:snappy/snappy-hello-640.webp%%', point: '%%IMG:snappy/snappy-point-640.webp%%', cheer: '%%IMG:snappy/snappy-cheer-640.webp%%', tilt: '%%IMG:snappy/snappy-tilt-640.webp%%', sit: '%%IMG:snappy/snappy-sit-640.webp%%', rest: '%%IMG:snappy/snappy-rest-640.webp%%' };
const PHOTOS = [%%PHOTOS%%];

/* ---------- words ---------- */
const words = h => { const d = document.createElement('div'); d.innerHTML = h; const out = []; [...d.childNodes].forEach(n => { if (n.nodeName === 'BR') { out.push('<br>'); return; }
  n.textContent.split(/\s+/).filter(Boolean).forEach(w => out.push(`<span class="w"><span class="wi${n.nodeType === 1 ? ' a' : ''}">${w}</span></span>`)); }); return out.join(' ').replace(/ <br> /g, '<br>'); };
const revealWords = (els, t, at, out, step = .07) => els.forEach((w, j) => { const p = E.o5(P(t, at + j * step, .7)), q = out ? E.i3(P(t, out + j * .03, .45)) : 0; put(w, { y: (1 - p) * 150 - q * 140, op: 1, blur: (1 - p) * 8 + q * 10 }); w.style.opacity = (Math.min(p * 1.6, 1) * (1 - q)).toFixed(3); });

/* ---------- opening photo cloud ---------- */
const FP = []; { const box = $('#fps'); const spots = [[-60, 980, -12, 380], [700, 900, 10, 360], [80, 1460, 6, 320], [660, 1450, -8, 360], [380, 1150, -3, 300], [-120, 1880, 14, 340], [760, 1880, -14, 320]];
  spots.forEach(([x, y, r, w], i) => { const d = document.createElement('div'); d.className = 'fp'; d.style.width = w + 'px'; d.style.height = Math.round(w * 1.25) + 'px'; d.style.backgroundImage = `url(${PHOTOS[i % PHOTOS.length]})`; box.appendChild(d); FP.push({ el: d, x, y, r, w, z: .7 + (i % 3) * .2 }); }); }
$('#h0').innerHTML = words('One week.<br>One theme.<br><span>Your best frame.</span>'); const h0W = $$('#h0 .wi');

/* ---------- logo ---------- */
$('#wm').innerHTML = 'SnapWeek'.split('').map((c, i) => `<span class="c${i >= 4 ? ' k' : ''}">${c}</span>`).join(''); const wmC = $$('#wm .c');

/* ---------- phone pages ---------- */
const PAGES = { home: [IMG.home, IMG.header, IMG.tabHome], discover: [IMG.discover, IMG.headerDisc, IMG.tabDisc], profile: [IMG.profile, IMG.header, IMG.tabDisc], theme: [IMG.theme, IMG.header, IMG.tabRank] };
const PG = {}; Object.entries(PAGES).forEach(([k, [c, h, tb]]) => { const d = document.createElement('div'); d.className = 'pg';
  d.innerHTML = `<div class="sbar"><span>9:41</span><span>5G ▮▮▮</span></div><img class="cnt" src="${c}"><img class="hdr" src="${h}" style="top:62px"><img class="tab" src="${tb}">`; $('#pages').appendChild(d);
  PG[k] = { el: d, cnt: d.querySelector('.cnt') }; });
const S = 540 / 780; // screenshot px -> phone px
// page schedule: [key, tIn, tOut], content scroll keys in screenshot px
const SCROLL = { home: [[7, 0], [12.4, 0], [13.6, 520], [19.6, 4300]], discover: [[20.2, 0], [21.4, 0], [23.4, 900]], profile: [[23.6, 0], [24.8, 0], [26.4, 560]], theme: [[26.6, 0], [27.6, 0], [29.4, 1120], [32.6, 1180]] };
const ORDER = [['home', 6.5, 20.4], ['discover', 19.8, 23.8], ['profile', 23.4, 26.8], ['theme', 26.4, 34]];

/* ---------- hearts (likes) ---------- */
const HEARTS = [[15.6, 760, 900], [16.9, 230, 1100], [18.0, 820, 1300], [21.8, 200, 1000], [22.6, 820, 1180]];
$('#hearts').innerHTML = HEARTS.map(() => `<svg class="heart" viewBox="0 0 24 24"><path d="M12 21s-7.5-4.6-9.6-9.2C.9 8.4 3 4.5 6.6 4.5c2.2 0 3.6 1.2 4.4 2.5.8-1.3 2.2-2.5 4.4-2.5 3.6 0 5.7 3.9 4.2 7.3C19.5 16.4 12 21 12 21z" fill="#d97757" stroke="#fff" stroke-width="1.6"/></svg>`).join('');
const heartEls = $$('#hearts .heart');

/* ---------- captions ---------- */
const CAPS = [{ a: 7.6, z: 13.4, h: 'A new theme<br><span>every Monday.</span>' }, { a: 13.8, z: 19.8, h: 'Post <span>one frame</span><br>a day.' },
  { a: 20.0, z: 23.4, h: 'Discover<br><span>photographers.</span>' }, { a: 23.6, z: 26.4, h: 'Get likes,<br><span>level up.</span>' }, { a: 26.6, z: 32.8, h: 'Climb the<br><span>weekly ranking.</span>' }];
CAPS.forEach(C => C.html = words(C.h)); let capI = -1, capW = [];

/* ---------- mascot appearances ---------- */
const SN = [{ k: 'hello', a: .9, z: 4.2, x: 560, y: 1330, s: .9, from: [0, 700] }, { k: 'point', a: 9.0, z: 13.2, x: -150, y: 1200, s: .8, from: [-600, 0], flip: 1 },
  { k: 'tilt', a: 21.0, z: 25.8, x: 640, y: 1330, s: .72, from: [600, 0] }, { k: 'cheer', a: 28.2, z: 33.0, x: 600, y: 1260, s: .85, from: [0, 800] }, { k: 'sit', a: 33.4, z: 41, x: 220, y: 1040, s: 1.0, from: [0, 900] }];
$('#snaps').innerHTML = SN.map(m => `<div class="snap" style="background-image:url(${SNAP[m.k]})"></div>`).join(''); const snEls = $$('#snaps .snap');

/* ---------- outro ---------- */
$('#oh').innerHTML = words('Your next<br>best frame<br>starts on <span>Monday.</span>'); const ohW = $$('#oh .wi');


/* ---------- phone camera: [t, x, y, s, rx, ry, rz] ---------- */
const CAM = [[6.6, [0, 1500, .85, 40, 0, 6]], [7.8, [0, 230, 1, 8, -10, 0]], [11.8, [0, 200, 1.02, 4, -6, 0]], [12.8, [0, 330, 1.42, 2, -3, 0]], [13.6, [0, 230, 1.05, 4, 8, 0]],
  [19.6, [0, 220, 1.06, 3, 10, 0]], [20.4, [-40, 230, 1.04, 4, -10, 0]], [26.2, [-40, 230, 1.06, 3, -6, 0]], [27.0, [0, 230, 1.04, 6, 8, 0]], [29.4, [0, 250, 1.3, 2, 4, 0]], [32.6, [0, 250, 1.34, 2, 2, 0]],
  [34.0, [0, -1500, .8, -30, 0, -6]]];

/* ---------- render ---------- */
const terra = $('#terra'), phone = $('#phone'), ph3 = $('#ph3'), logoL = $('#logoL'), logo = $('#logo'), outro = $('#outro');
function render(t) {
  $('#b1').style.transform = `translate(${-300 + Math.sin(t * .25) * 260}px,${-260 + Math.cos(t * .2) * 220}px)`;
  $('#b2').style.transform = `translate(${300 + Math.cos(t * .22) * 240}px,${1000 + Math.sin(t * .17) * 280}px)`;
  const tp = E.io3(P(t, 32.7, 1.2)); terra.style.opacity = tp.toFixed(3); terra.style.clipPath = tp < 1 ? `circle(${(tp * 140).toFixed(2)}% at 50% 70%)` : 'none';
  // opening cloud -> converges into the logo
  const cloudOn = t < 5; vis($('#fps'), cloudOn);
  if (cloudOn) { const conv = E.io5(P(t, 3.4, 1.2)); FP.forEach((F, i) => { const enter = E.o5(P(t, .1 + i * .12, 1.2)); const drift = Math.sin(t * .6 + i) * 18 * F.z;
    put(F.el, { x: lerp(F.x, 540 - F.w / 2, conv) + drift, y: lerp(F.y + (1 - enter) * 500, 760 - F.w * .62, conv) - t * 30 * F.z * (1 - conv), r: F.r * (1 - conv) + Math.sin(t * .5 + i) * 2 * (1 - conv), s: lerp(1, .15, conv) * (.8 + .2 * enter), op: enter * (1 - E.i3(P(t, 4.1, .4))) }); }); }
  // opening headline
  const h0On = t < 4.6; vis($('#h0'), h0On); if (h0On) revealWords(h0W, t, .25, 3.5, .32);
  // logo
  const lgOn = t >= 3.7 && t < 7.4; vis(logoL, lgOn);
  if (lgOn) { const a = E.spring(P(t, 3.8, 1.4)), up = E.io5(P(t, 5.9, 1.1)); put(logo, { s: (.2 + .8 * a) * (1 - .55 * up), y: -420 * up, r: (1 - E.o3(P(t, 3.8, 1.2))) * -90, op: P(t, 3.8, .2) * (1 - E.i3(P(t, 6.5, .5))) });
    wmC.forEach((el, i) => { const p = E.o5(P(t, 4.3 + i * .045, .8)); put(el, { y: (1 - p) * 170 - 480 * up, op: Math.min(1, p * 1.4) * (1 - up), blur: (1 - p) * 10 + up * 8 }); });
    const g = E.o3(P(t, 5.1, .8)); put($('#tag'), { y: (1 - g) * 50 - 480 * up, op: g * (1 - up), blur: (1 - g) * 10 }); }
  // phone
  const phOn = t >= 6.6 && t < 34; vis(ph3, phOn);
  if (phOn) { const [x, y, s, rx, ry, rz] = track(CAM, t), fl = Math.sin(t * 1.1) * 8;
    phone.style.transform = `translate3d(${x.toFixed(2)}px,${(y + fl).toFixed(2)}px,0) rotateX(${rx.toFixed(3)}deg) rotateY(${ry.toFixed(3)}deg) rotateZ(${rz.toFixed(3)}deg) scale(${(s * 1.1).toFixed(4)})`;
    // pages slide horizontally like switching tabs
    ORDER.forEach(([k, a, z]) => { const on = t >= a && t < z; vis(PG[k].el, on); if (!on) return; const pin = E.io5(P(t, a, .6)), pout = E.io5(P(t, z - .6, .6));
      PG[k].el.style.transform = `translateX(${((1 - pin) * 540 - pout * 540).toFixed(2)}px)`; PG[k].cnt.style.transform = `translateY(${(-track(SCROLL[k], t) * S).toFixed(2)}px)`; }); }
  // hearts
  HEARTS.forEach(([at, x, y], i) => { const p = P(t, at, 1.3), el = heartEls[i]; vis(el, p > 0 && p < 1); if (p <= 0 || p >= 1) return;
    put(el, { x, y: y - 220 * E.o3(p), s: .3 + .9 * E.back(clamp(p * 2.5)), op: 1 - E.i3(clamp((p - .55) / .45)), r: Math.sin(p * 6) * 10 }); });
  // captions
  const ci = CAPS.findIndex(C => t >= C.a - .05 && t < C.z + .5); vis($('#cap'), ci >= 0);
  if (ci >= 0) { const C = CAPS[ci]; if (ci !== capI) { capI = ci; $('#cap').innerHTML = C.html; capW = $$('#cap .wi'); } revealWords(capW, t, C.a, C.z - .1); }
  // mascot
  SN.forEach((m, i) => { const el = snEls[i], on = t >= m.a - .1 && t < m.z + .1; vis(el, on); if (!on) return;
    const pin = E.back(P(t, m.a, .9)), pout = E.io3(P(t, m.z - .7, .7)), bob = Math.sin((t - m.a) * 3.2) * 10, wave = m.k === 'hello' || m.k === 'cheer' ? Math.sin((t - m.a) * 5) * 4 : Math.sin((t - m.a) * 2) * 2;
    put(el, { x: m.x + m.from[0] * (1 - pin) + m.from[0] * pout, y: m.y + m.from[1] * (1 - pin) + m.from[1] * pout + bob, s: m.s * (.85 + .15 * Math.min(1, pin)), r: wave, op: 1 });
    if (m.flip) el.style.transform += ' scaleX(-1)'; });
  // outro
  const oOn = t >= 33.0; vis(outro, oOn);
  if (oOn) { revealWords(ohW, t, 33.2, 0, .08); const u = E.back(P(t, 34.9, .8)); $('#url').style.transform = `translateX(-50%) scale(${(.5 + .5 * u).toFixed(4)})`; $('#url').style.opacity = clamp(u * 1.6).toFixed(3);
    $('#shine').style.left = (-240 + 1200 * E.io3(P(t, 36.6, 1.4))) + 'px'; const bi = E.back(P(t, 35.8, .8)); put($('#bio'), { y: (1 - bi) * 80, s: .9 + .1 * Math.min(1, bi), op: clamp(bi * 1.5) }); const s2 = E.o3(P(t, 36.6, .8)); put($('#osub'), { y: (1 - s2) * 40, op: s2 }); }
  $('#demo').style.opacity = (t > 7.6 && t < 33 ? .75 : 0).toString();
}

/* ---------- clock & controls ---------- */
const stage = $('#stage'), vp = $('#vp'), aud = $('#aud');
const fit = () => stage.style.transform = `scale(${vp.clientWidth / 1080})`; new ResizeObserver(fit).observe(vp); fit();
let t = 0, playing = !document.body.classList.contains('export'), last = performance.now(), snd = false;
